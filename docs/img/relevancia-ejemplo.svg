<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Ejemplo inventado: siete cláusulas y los enlaces entre ellas</title>
  <desc>Las cláusulas 1, 2 y 3 necesitan la cláusula 7. La 2 necesita además la 6, con dos enlaces. La 4 necesita la 5 y la 5 necesita la 6. Las cláusulas 7, 6 y 5 quedan por encima de la base; las cláusulas 1 a 4 se quedan en la base.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="429" rx="10" fill="#ffffff" stroke="#e5e7eb"/>

  <g fill="#EEEDFE" stroke="#534AB7">
    <rect x="40" y="110" width="150" height="56" rx="8"/>
    <rect x="490" y="110" width="150" height="56" rx="8"/>
    <rect x="490" y="290" width="150" height="56" rx="8"/>
  </g>
  <g fill="#F1EFE8" stroke="#888780">
    <rect x="265" y="40" width="150" height="56" rx="8"/>
    <rect x="265" y="110" width="150" height="56" rx="8"/>
    <rect x="265" y="180" width="150" height="56" rx="8"/>
    <rect x="265" y="290" width="150" height="56" rx="8"/>
  </g>

  <g text-anchor="middle" font-size="14" font-weight="600">
    <g fill="#3C3489">
      <text x="115" y="133">Cláusula 7</text>
      <text x="565" y="133">Cláusula 6</text>
      <text x="565" y="313">Cláusula 5</text>
    </g>
    <g fill="#2C2C2A">
      <text x="340" y="63">Cláusula 1</text>
      <text x="340" y="133">Cláusula 2</text>
      <text x="340" y="203">Cláusula 3</text>
      <text x="340" y="313">Cláusula 4</text>
    </g>
  </g>
  <g text-anchor="middle" font-size="12">
    <g fill="#534AB7">
      <text x="115" y="153">2.17 b · puesto 1</text>
      <text x="565" y="153">2.08 b · puesto 2</text>
      <text x="565" y="333">1.50 b · puesto 3</text>
    </g>
    <g fill="#5F5E5A">
      <text x="340" y="83">b · sin puesto</text>
      <text x="340" y="153">b · sin puesto</text>
      <text x="340" y="223">b · sin puesto</text>
      <text x="340" y="333">b · sin puesto</text>
    </g>
  </g>

  <g fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#flecha)">
    <line x1="265" y1="68" x2="198" y2="124"/>
    <line x1="265" y1="138" x2="198" y2="138"/>
    <line x1="265" y1="208" x2="198" y2="152"/>
    <line x1="415" y1="131" x2="482" y2="131"/>
    <line x1="415" y1="145" x2="482" y2="145"/>
    <line x1="415" y1="318" x2="482" y2="318"/>
    <line x1="565" y1="290" x2="565" y2="174"/>
  </g>

  <g font-size="12" fill="#5F5E5A">
    <text x="40" y="384">Flecha: para leer la cláusula de origen hace falta la de destino.</text>
    <text x="40" y="404">Morado: alguna cláusula la necesita. Gris: ninguna la necesita y se queda en la base b.</text>
  </g>
</svg>
