<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Graph Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="panel controls">
        <div class="actions">
          <label class="file-button primary-file-button" for="file-input">Open File</label>
          <input id="file-input" type="file" accept=".json,application/json">
        </div>

        <label class="field">
          <span>Search nodes</span>
          <input id="search-input" type="search" placeholder="party, clause 5.3.5, obligation...">
        </label>

        <label class="checkbox">
          <input id="labels-toggle" type="checkbox">
          <span>Show node labels</span>
        </label>
      </div>
      
      <div class="panel legend">
        <div class="panel-header">
          <h2>Types</h2>
        </div>
        <ul id="legend-list"></ul>
      </div>

      <div class="panel stats">
        <div class="stat-row"><span>Source file</span><strong id="stat-source">-</strong></div>
        <div class="stat-row"><span>Nodes</span><strong id="stat-nodes">0</strong></div>
        <div class="stat-row"><span>Edges</span><strong id="stat-edges">0</strong></div>
      </div>


    </aside>

    <main class="canvas-wrap">
      <div class="statusbar">
        <span id="status-text">Waiting for graph data.</span>
      </div>
      <div class="graph-stage">
        <svg id="graph-svg" aria-label="Knowledge graph visualization"></svg>
      </div>
      <section class="edge-panel">
        <div class="edge-panel-header">
          <h2>Selected Relation</h2>
          <span class="muted">Click an edge to inspect its triplet.</span>
        </div>
        <div id="edge-details-content" class="edge-details-content">
          <p class="muted">No edge selected.</p>
        </div>
      </section>
    </main>

    <aside class="details-sidebar">
      <div class="panel details">
        <div class="panel-header">
          <h2>Details</h2>
        </div>
        <div id="details-content" class="details-content">
          <p class="muted">Select a node to inspect its attributes and connected relations.</p>
        </div>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
