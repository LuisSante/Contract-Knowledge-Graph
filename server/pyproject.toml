[project]
name = "contravis-backend"
version = "0.1.0"
description = "ContraVis backend — Django REST Framework (document viewer + paragraph graph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    # Domain models + config (reused from the service layer).
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # LLM clients + tokenizer used by the assistant/contradiction/llm modules.
    # Light enough to install eagerly (unlike sentence-transformers/torch).
    "openai>=2.0",
    "google-genai>=1.0",
    "tiktoken>=0.7",
    # Needed only to actually run POST /process (graph embeddings).
    # Heavy (pulls torch); install when you want the graph endpoint live:
    #   uv add sentence-transformers
    # "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]
