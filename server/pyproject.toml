[project]
name = "second"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openai>=2.0",
    "tiktoken>=0.7",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "ruff>=0.6",
]
link-prediction = [
    "pykeen>=1.11.1",
    "torch==2.12.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
]

[tool.ruff]
line-length = 150
